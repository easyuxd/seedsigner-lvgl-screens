<!doctype html>
<!--
  SeedSigner Design Studio: the Redesign prototype at every target size, side by
  side, with live reload and a read-only inspector. Each device is an iframe running
  its own copy of the real LVGL engine (device.html). See context/design-studio.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Studio</title>
<style>
  :root {
    --bg: #0e0e10; --panel: #17171a; --line: #2a2a2e; --text: #ececee; --muted: #9a9aa2;
    --dim: #6b6b73; --accent: #FF9F0A; --blue: #409CFF; --ok: #30D158; --warn: #FFD60A; --err: #FF453A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { display: grid; grid-template-rows: 48px minmax(0, 1fr); }
  header { display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg a, .seg button { color: var(--muted); background: none; border: 0; padding: 5px 12px; font: inherit;
    text-decoration: none; cursor: pointer; }
  .seg .on { background: #26262b; color: var(--text); }
  .grow { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    background: #1f1f23; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .pill.live .dot { background: var(--ok); } .pill.busy .dot { background: var(--warn); }
  .pill.bad .dot { background: var(--err); } .pill.bad { color: var(--text); }
  button.tool { color: var(--text); background: #1f1f23; border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 12px; font: inherit; cursor: pointer; }
  button.tool.on { border-color: var(--blue); color: var(--blue); }
  main { display: grid; grid-template-columns: 210px minmax(0, 1fr) 300px; min-height: 0; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 12px 8px; }
  aside.right { border-right: 0; border-left: 1px solid var(--line); padding: 12px 14px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 4px 8px 8px; }
  aside.right .label { margin: 4px 0 8px; }
  .screen { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px;
    cursor: pointer; color: var(--muted); }
  .screen:hover { background: #202024; color: var(--text); }
  .screen.on { background: #2a2a30; color: var(--text); }
  .screen small { color: var(--dim); }
  #stage { display: flex; justify-content: safe center; align-items: safe center; gap: 40px; padding: 24px; overflow: auto; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .bezel { padding: 10px; background: #1b1b1e; border-radius: 22px; border: 1px solid #2c2c31; }
  .bezel iframe { display: block; border: 0; border-radius: 6px; background: #000; }
  figcaption { color: var(--muted); text-align: center; }
  figcaption b { color: var(--text); font-weight: 600; }
  #banner { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; white-space: pre-wrap;
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  #banner.err { display: block; background: #3a1414; color: #ffb4ae; border: 1px solid #6d2420; }
  #banner.busy { display: block; background: #2e2a12; color: #f3e3a0; border: 1px solid #5c5320; }
  .kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 10px; margin-bottom: 14px; }
  .kv div:nth-child(odd) { color: var(--dim); }
  .kv div:nth-child(even) { font-family: ui-monospace, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
  .hint { color: var(--dim); }
  .warn { color: var(--warn); margin: 0 0 6px; } .err { color: var(--err); margin: 0 0 6px; }
  kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 4px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>SeedSigner Design Studio</h1>
  <nav class="seg" aria-label="Design">
    <a href="../runner/" title="Upstream landscape screens">Classic</a>
    <a class="on" href="./" aria-current="page">Redesign</a>
  </nav>
  <span class="grow"></span>
  <nav class="seg" aria-label="Zoom">
    <button id="z-fit" class="on">Fit</button><button id="z-1">1×</button>
  </nav>
  <button id="inspect-btn" class="tool" title="Inspect (I)">Inspect <kbd>I</kbd></button>
  <span id="live" class="pill"><span class="dot"></span><span id="live-text">Static</span></span>
</header>
<main>
  <aside>
    <div class="label">Screens</div>
    <div id="screens"></div>
  </aside>
  <section id="stage"></section>
  <aside class="right">
    <div id="banner"></div>
    <div class="label">Inspector</div>
    <div id="inspector"><p class="hint">Press <kbd>I</kbd> or Inspect, then point at anything on a device. Click to pin it.</p></div>
    <div class="label">Problems</div>
    <div id="problems"><p class="hint">None</p></div>
  </aside>
</main>
<script>
  // The target devices. Same firmware design, two panels (context/devices.md).
  var DEVICES = [
    { name: '3.5', w: 320, h: 480, label: '3.5″ · 320×480' },
    { name: '4.3', w: 480, h: 800, label: '4.3″ · 480×800' },
  ];
  var state = { path: '', zoom: 'fit', inspect: false, status: {}, pinned: null };
  var frames = {};
  var stage = document.getElementById('stage');

  // ---- Devices -------------------------------------------------------------
  function buildDevices() {
    stage.innerHTML = '';
    DEVICES.forEach(function (d) {
      var fig = document.createElement('figure');
      var bezel = document.createElement('div');
      bezel.className = 'bezel';
      var f = document.createElement('iframe');
      f.title = d.label;
      f.src = 'device.html?w=' + d.w + '&h=' + d.h + '&name=' + d.name +
              '&path=' + encodeURIComponent(state.path) + '&_=' + Date.now();
      bezel.appendChild(f);
      var cap = document.createElement('figcaption');
      fig.appendChild(bezel); fig.appendChild(cap);
      stage.appendChild(fig);
      frames[d.name] = { el: f, cap: cap, dev: d };
    });
    layout();
  }

  // Fit: the tallest device fills the height, and all devices fit the width.
  // One shared zoom, so the two sizes stay in true proportion to each other.
  function fitZoom() {
    var availH = stage.clientHeight - 48 - 20 - 40;                   // padding, bezel, caption
    var availW = stage.clientWidth - 48 - DEVICES.length * 22 - (DEVICES.length - 1) * 40;
    var maxH = Math.max.apply(null, DEVICES.map(function (d) { return d.h; }));
    var sumW = DEVICES.reduce(function (a, d) { return a + d.w; }, 0);
    return Math.min(1, availH / maxH, availW / sumW);
  }

  function layout() {
    var fit = fitZoom();
    DEVICES.forEach(function (d) {
      var fr = frames[d.name]; if (!fr) return;
      var k = state.zoom === 'fit' ? fit : 1;
      fr.el.style.width = Math.round(d.w * k) + 'px';
      fr.el.style.height = Math.round(d.h * k) + 'px';
      fr.cap.innerHTML = '<b>' + d.label + '</b><br>' + Math.round(k * 100) + '% · 1 pt = ' +
        (d.w / 320) + ' px';
    });
  }
  window.addEventListener('resize', layout);

  function send(name, msg) {
    msg.src = 'rd-studio';
    var fr = frames[name];
    if (fr && fr.el.contentWindow) fr.el.contentWindow.postMessage(msg, '*');
  }
  function sendAll(msg) { DEVICES.forEach(function (d) { send(d.name, Object.assign({}, msg)); }); }

  // ---- Screens list ----------------------------------------------------------
  var screens = [];
  function renderScreens() {
    var cur = state.path.split('/').pop();
    var box = document.getElementById('screens');
    box.innerHTML = '';
    screens.forEach(function (s, i) {
      var row = document.createElement('div');
      row.className = 'screen' + (s.id === cur || (!cur && i === 0) ? ' on' : '');
      row.innerHTML = '<span></span><small></small>';
      row.firstChild.textContent = s.title;
      row.lastChild.textContent = s.type.replace(/_/g, ' ');
      row.onclick = function () {
        // Open it on top of the start screen, so Back works.
        var start = screens[0] ? screens[0].id : '';
        go(s.id === start ? start : start + '/' + s.id);
      };
      box.appendChild(row);
    });
  }
  function go(path) {
    state.path = path;
    sendAll({ cmd: 'show', path: path });
    renderScreens();
    try { history.replaceState(null, '', '#' + path); } catch (e) {}
  }

  // ---- Inspector ---------------------------------------------------------------
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function showInfo(info, device) {
    var el = document.getElementById('inspector');
    if (!info || !info.found) {
      el.innerHTML = state.inspect
        ? '<p class="hint">Point at anything on a device. Click to pin it.</p>'
        : '<p class="hint">Press <kbd>I</kbd> or Inspect, then point at anything on a device. Click to pin it.</p>';
      return;
    }
    var rows = [['component', info.component], ['device', device + '″']];
    if (info.path) rows.push(['path', info.path]);
    if (info.screen_type) rows.push(['screen type', info.screen_type]);
    if (info.responsive) rows.push(['responsive', info.responsive]);
    rows.push(['size', info.w_pt + ' × ' + info.h_pt + ' pt']);
    rows.push(['pixels', info.w + ' × ' + info.h + ' px']);
    if (info.muted) rows.push(['muted', 'yes (opacity.muted)']);
    var html = '<div class="kv">' + rows.map(function (r) {
      return '<div>' + esc(r[0]) + '</div><div>' + esc(r[1]) + '</div>';
    }).join('') + '</div>';
    var t = info.tokens || {};
    var keys = Object.keys(t);
    if (keys.length) {
      html += '<div class="label">Tokens</div><div class="kv">' + keys.map(function (k) {
        return '<div>' + esc(k) + '</div><div>' + esc(t[k]) + '</div>';
      }).join('') + '</div>';
    }
    if (info.parents && info.parents.length) {
      html += '<div class="label">Inside</div><p class="hint">' + info.parents.map(esc).join(' › ') + '</p>';
    }
    el.innerHTML = html;
  }
  function setInspect(on) {
    state.inspect = on;
    document.getElementById('inspect-btn').classList.toggle('on', on);
    sendAll({ cmd: 'inspect', on: on });
    state.pinned = null;
    showInfo(null);
  }
  document.getElementById('inspect-btn').onclick = function () { setInspect(!state.inspect); };
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'i' || e.key === 'I') setInspect(!state.inspect);
    if (e.key === 'Escape' && state.inspect) setInspect(false);
  });
  document.getElementById('z-fit').onclick = function () { setZoom('fit'); };
  document.getElementById('z-1').onclick = function () { setZoom('1'); };
  function setZoom(z) {
    state.zoom = z;
    document.getElementById('z-fit').classList.toggle('on', z === 'fit');
    document.getElementById('z-1').classList.toggle('on', z === '1');
    layout();
  }

  // ---- Problems ------------------------------------------------------------------
  var problems = {};
  function renderProblems() {
    var lines = [];
    Object.keys(problems).forEach(function (src) {
      var p = problems[src];
      if (p.error) lines.push('<p class="err">' + esc(p.error) + '</p>');
      (p.warnings || []).forEach(function (w) {
        var line = '<p class="warn">' + esc(w) + '</p>';
        if (lines.indexOf(line) < 0) lines.push(line);
      });
    });
    document.getElementById('problems').innerHTML = lines.join('') || '<p class="hint">None</p>';
  }

  // ---- Messages from devices --------------------------------------------------
  window.addEventListener('message', function (ev) {
    var m = ev.data || {};
    if (m.src !== 'rd-device') return;
    if (m.evt === 'ready') {
      screens = m.detail.screens || [];
      renderScreens();
      if (state.inspect) send(m.name, { cmd: 'inspect', on: true });
    } else if (m.evt === 'navigate') {
      if (m.detail !== state.path) { state.path = m.detail; go(m.detail); }
    } else if (m.evt === 'status') {
      problems.engine = m.detail; renderProblems();
    } else if (m.evt === 'hover') {
      if (!state.pinned) showInfo(m.detail, m.name);
    } else if (m.evt === 'select') {
      state.pinned = m.detail.found ? m.detail : null;
      showInfo(m.detail, m.name);
    }
  });

  // ---- Live reload (only when served by the Design Studio server) ---------------
  var banner = document.getElementById('banner');
  function setLive(cls, text) {
    var el = document.getElementById('live');
    el.className = 'pill ' + cls;
    document.getElementById('live-text').textContent = text;
  }
  function setBanner(cls, text) { banner.className = cls || ''; banner.textContent = text || ''; }
  function stamp() { return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }

  if (location.protocol.indexOf('http') === 0 && window.EventSource) {
    var es = new EventSource('/events');
    es.addEventListener('hello', function () { setLive('live', 'Live'); });
    es.addEventListener('data', function () {
      delete problems.json; setBanner(); renderProblems();
      state.pinned = null; showInfo(null);
      sendAll({ cmd: 'reload-data' }); setLive('live', 'Updated ' + stamp());
    });
    es.addEventListener('data-error', function (e) {
      problems.json = { error: e.data }; renderProblems();
      setBanner('err', e.data); setLive('bad', 'Fix the JSON');
    });
    es.addEventListener('building', function () { setBanner('busy', 'Rebuilding the engine (C changed)…'); setLive('busy', 'Rebuilding'); });
    es.addEventListener('build-failed', function (e) { setBanner('err', 'Build failed:\n' + e.data); setLive('bad', 'Build failed'); });
    es.addEventListener('engine', function () { setBanner(); state.pinned = null; showInfo(null); buildDevices(); setLive('live', 'Rebuilt ' + stamp()); });
    es.addEventListener('page', function () { location.reload(); });
    es.onerror = function () { setLive('', 'Server stopped'); };
  }

  state.path = decodeURIComponent((location.hash || '').slice(1));
  buildDevices();
</script>
</body>
</html>
