<!doctype html>
<!--
  SeedSigner Design Studio: view, edit, prototype and review the Redesign.
    Design mode     a canvas of every screen (real engine renders), grouped by flow
    Prototype mode  live devices (one engine per device, device.html), with a frame-rate dial
  Edits save straight to tokens.json / prototype.json through studio.py; history and comments
  live in .studio/. The app is studio.js; the look is studio.css. See context/design-studio.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Studio</title>
<link rel="stylesheet" href="studio.css">
</head>
<body class="mode-design">
<div id="app">
  <header id="top">
    <div class="zone l">
      <button class="mark" id="menu-btn" title="Menu" aria-haspopup="menu">DS</button>
      <div class="doc"><span class="name">SeedSigner Redesign</span><span class="meta" id="saved">Loading…</span></div>
    </div>
    <div class="zone c" id="center"></div>
    <div class="zone r">
      <div class="seg" id="mode-seg" title="Switch (⇧E)">
        <button data-mode="design" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Design</button>
        <button data-mode="proto"><svg class="i" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>Prototype</button>
      </div>
      <span class="sep"></span>
      <button class="ibtn" id="undo" title="Undo (⌘Z)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="ibtn" id="redo" title="Redo (⇧⌘Z)"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="ibtn" id="hist-btn" title="Version history (⌥⌘H)"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l4 2"/></svg></button>
      <span class="sep"></span>
      <button class="btn unsent" id="unsent-btn" title="Comments waiting to be sent" hidden><span class="dot"></span><span id="unsent-n">0</span> to send</button>
      <span class="status" id="live" title="Static"><span class="dot"></span><span id="live-text">Static</span></span>
    </div>
  </header>

  <aside id="left" aria-label="Screens, layers and tokens">
    <div class="ptabs" id="ltabs" role="tablist"><button data-tab="screens">Screens</button><button data-tab="layers">Layers</button><button data-tab="tokens">Tokens</button></div>
    <div class="pbody scroll" id="lbody"></div>
  </aside>

  <main id="canvas" aria-label="Canvas">
    <div id="world"></div>
    <div id="ov"></div>
    <div id="loading">Rendering screens…</div>
    <div id="vbanner"></div>
    <div id="zoombar">
      <button class="ibtn" id="zout" title="Zoom out (−)"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="z" id="zpct" title="Zoom">100%</button>
      <button class="ibtn" id="zin" title="Zoom in (+)"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </main>

  <section id="player" aria-label="Live devices">
    <div id="pbar"></div>
    <div id="stage"></div>
  </section>

  <aside id="right" aria-label="Inspector"></aside>
</div>

<iframe id="snap-host" title="Screen renderer" aria-hidden="true" tabindex="-1"></iframe>
<div class="menu" id="menu" role="menu"></div>
<div id="scrim"></div>
<div id="toast" role="status"></div>
<script src="studio.js"></script>
</body>
</html>
