<!doctype html>
<!--
  One Redesign device: a single LVGL engine instance (index.js/.wasm) rendering the
  prototype at one screen size (?w=&h=). The Design Studio (index.html) embeds these
  and drives them with postMessage; see context/design-studio.md.
    live device (Prototype mode)  ?w=&h=&name=&path=   tap, inspect, comment, frame rate
    snapshot engine (canvas)      ?w=&h=&snap=1        renders every screen to a picture
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redesign device</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; background: #000; }
  #inspect { position: absolute; inset: 0; cursor: crosshair; display: none; }
  #hl, #pin { position: absolute; pointer-events: none; display: none; box-sizing: border-box; }
  #hl  { box-shadow: 0 0 0 1px #409CFF; }
  #pin { box-shadow: 0 0 0 1.5px #409CFF; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  <div id="pin"></div>
  <div id="hl"></div>
  <div id="inspect"></div>
</div>
<script>
  var params = new URLSearchParams(location.search);
  var W = parseInt(params.get('w'), 10) || 320;
  var H = parseInt(params.get('h'), 10) || 480;
  var NAME = params.get('name') || (W + 'x' + H);
  var SNAP = params.get('snap') === '1';
  var api = null, mode = 'interact';

  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
  };

  function post(evt, detail) {
    parent.postMessage({ src: 'rd-device', name: NAME, evt: evt, detail: detail }, '*');
  }

  function postStatus() {
    var s = {};
    try { s = JSON.parse(api.status()); } catch (e) {}
    post('status', s);
  }
  // Part boxes for the studio's pins and Layers. Sent a moment later, once LVGL has laid
  // the screen out (right after a show, every box is still at 0,0).
  var outlineTimer = 0;
  function postOutline() {
    if (SNAP) return;
    clearTimeout(outlineTimer);
    outlineTimer = setTimeout(function () { post('outline', { path: api.current(), boxes: JSON.parse(api.outline()) }); }, 150);
  }

  async function fetchText(name) {
    var r = await fetch('data/' + name + '.json?_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(name + '.json: HTTP ' + r.status);
    return r.text();
  }

  // Load both JSON files; a load that fails keeps the previous (last good) data.
  async function loadData() {
    var texts = await Promise.all([fetchText('tokens'), fetchText('prototype')]);
    api.tokens(texts[0]);
    api.proto(texts[1]);
  }

  // Snapshot engine: render each screen and read its RGB565 frame buffer straight from the
  // WASM heap (the WebGL canvas is never shown), plus every part's box for hit-testing.
  var snapCanvas = null;
  function snapAll(ids) {
    if (!snapCanvas) { snapCanvas = document.createElement('canvas'); snapCanvas.width = W; snapCanvas.height = H; }
    var ctx = snapCanvas.getContext('2d'), img = ctx.createImageData(W, H), d = img.data, out = {};
    ids.forEach(function (id) {
      api.show(id);
      Module._ss_render_now();
      var fb = new Uint16Array(Module.HEAPU16.buffer, Module._ss_get_framebuffer(), W * H);
      for (var i = 0; i < W * H; i++) {
        var v = fb[i];
        d[i * 4] = ((v >> 11) & 31) * 255 / 31; d[i * 4 + 1] = ((v >> 5) & 63) * 255 / 63;
        d[i * 4 + 2] = (v & 31) * 255 / 31; d[i * 4 + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      out[id] = { url: snapCanvas.toDataURL('image/png'), boxes: JSON.parse(api.outline()) };
    });
    post('snaps', { w: W, h: H, shots: out });
  }

  // Engine ready (called from web_runner.cpp main()).
  window.ssOnReady = async function () {
    api = {
      start:   Module.cwrap('ss_rd_start', null, []),
      size:    Module.cwrap('ss_rd_set_size', null, ['number', 'number']),
      tokens:  Module.cwrap('ss_rd_load_tokens', 'number', ['string']),
      proto:   Module.cwrap('ss_rd_load_prototype', 'number', ['string']),
      show:    Module.cwrap('ss_rd_show', 'number', ['string']),
      refresh: Module.cwrap('ss_rd_refresh', 'number', []),
      status:  Module.cwrap('ss_rd_status', 'string', []),
      list:    Module.cwrap('ss_rd_screen_list', 'string', []),
      current: Module.cwrap('ss_rd_current', 'string', []),
      inspect: Module.cwrap('ss_rd_inspect', 'string', ['number', 'number']),
      outline: Module.cwrap('ss_rd_outline', 'string', []),
      fps:     Module.cwrap('ss_set_frame_rate', null, ['number']),
    };
    api.start();
    api.size(W, H);
    try { await loadData(); } catch (e) { post('status', { error: String(e), warnings: [] }); }
    if (!SNAP) api.show(params.get('path') || '');
    post('ready', { screens: JSON.parse(api.list()), w: W, h: H });
    postStatus();
    postOutline();
  };

  window.rdOnEvent = function (evt, detail) {
    if (evt === 'navigate' && !SNAP) {
      clearPin(); post('navigate', detail);
      setTimeout(function () { postStatus(); postOutline(); }, 0);
    }
  };

  // ---- Inspect and comment (pointer over the device) ----------------------
  var ov = document.getElementById('inspect');
  var hl = document.getElementById('hl');
  var pin = document.getElementById('pin');

  function toDevice(ev) {
    var r = ov.getBoundingClientRect();
    return { x: Math.round((ev.clientX - r.left) * W / r.width),
             y: Math.round((ev.clientY - r.top) * H / r.height), k: r.width / W };
  }
  function place(el, info, k) {
    if (!info || !info.found) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.style.left = (info.x * k) + 'px';
    el.style.top = (info.y * k) + 'px';
    el.style.width = (info.w * k) + 'px';
    el.style.height = (info.h * k) + 'px';
  }
  function clearPin() { pin.style.display = 'none'; }
  function probe(ev) {
    var p = toDevice(ev);
    var info = JSON.parse(api.inspect(p.x, p.y));
    return { info: info, k: p.k, x: p.x, y: p.y };
  }
  ov.addEventListener('mousemove', function (ev) {
    if (!api || mode !== 'inspect') return;
    var r = probe(ev);
    place(hl, r.info, r.k);
    post('hover', r.info);
  });
  ov.addEventListener('mouseleave', function () { hl.style.display = 'none'; post('hover', { found: false }); });
  ov.addEventListener('click', function (ev) {
    if (!api) return;
    var r = probe(ev);
    if (mode === 'comment') { post('pick', { x: r.x, y: r.y, info: r.info, path: api.current() }); return; }
    place(pin, r.info, r.k);
    post('select', r.info);
  });

  // ---- Commands from the studio ------------------------------------------
  window.addEventListener('message', async function (ev) {
    var m = ev.data || {};
    if (m.src !== 'rd-studio' || !api) return;
    if (m.cmd === 'show') {
      if (api.current() !== m.path) api.show(m.path);
    } else if (m.cmd === 'reload-data') {
      try { await loadData(); } catch (e) { post('status', { error: String(e), warnings: [] }); return; }
      if (SNAP) { post('reloaded', {}); return; }
      api.show(api.current());
      post('ready', { screens: JSON.parse(api.list()), w: W, h: H });
      postStatus();
      postOutline();
    } else if (m.cmd === 'load-texts') {
      // A version from the history, to preview it (snapshot engine).
      api.tokens(m.tokens); api.proto(m.prototype);
      post('reloaded', {});
    } else if (m.cmd === 'snap') {
      snapAll(m.ids || []);
      postStatus();
    } else if (m.cmd === 'mode') {
      mode = m.mode;
      ov.style.display = mode === 'interact' ? 'none' : 'block';
      ov.style.cursor = mode === 'comment' ? 'copy' : 'crosshair';
      if (mode !== 'inspect') { hl.style.display = 'none'; clearPin(); }
    } else if (m.cmd === 'select') {
      // The studio picked a part (Layers, canvas): show its outline here too.
      var boxes = JSON.parse(api.outline()), b = boxes.filter(function (x) { return m.path && x.path === m.path; })[0];
      var k = ov.getBoundingClientRect().width / W || document.getElementById('wrap').clientWidth / W;
      place(pin, b ? Object.assign({ found: true }, b) : null, k);
    } else if (m.cmd === 'fps') {
      api.fps(m.fps);
    }
  });
</script>
<script async src="index.js"></script>
</body>
</html>
