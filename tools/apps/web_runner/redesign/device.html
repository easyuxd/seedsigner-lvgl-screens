<!doctype html>
<!--
  One Redesign device: a single LVGL engine instance (index.js/.wasm) rendering the
  prototype at one screen size (?w=&h=). The Design Studio (index.html) embeds one of
  these per size and drives them with postMessage; see context/design-studio.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redesign device</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; background: #000; }
  #inspect { position: absolute; inset: 0; cursor: crosshair; display: none; }
  #hl, #pin { position: absolute; pointer-events: none; display: none; box-sizing: border-box; }
  #hl  { border: 2px solid #409CFF; background: rgba(64, 156, 255, 0.12); }
  #pin { border: 2px dashed #FF9F0A; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  <div id="pin"></div>
  <div id="hl"></div>
  <div id="inspect"></div>
</div>
<script>
  var params = new URLSearchParams(location.search);
  var W = parseInt(params.get('w'), 10) || 320;
  var H = parseInt(params.get('h'), 10) || 480;
  var NAME = params.get('name') || (W + 'x' + H);
  var api = null;

  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
  };

  function post(evt, detail) {
    parent.postMessage({ src: 'rd-device', name: NAME, evt: evt, detail: detail }, '*');
  }

  function postStatus() {
    var s = {};
    try { s = JSON.parse(api.status()); } catch (e) {}
    post('status', s);
  }

  async function fetchText(name) {
    var r = await fetch('data/' + name + '.json?_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(name + '.json: HTTP ' + r.status);
    return r.text();
  }

  // Load both JSON files; a load that fails keeps the previous (last good) data.
  async function loadData() {
    var texts = await Promise.all([fetchText('tokens'), fetchText('prototype')]);
    api.tokens(texts[0]);
    api.proto(texts[1]);
  }

  // Engine ready (called from web_runner.cpp main()).
  window.ssOnReady = async function () {
    api = {
      start:   Module.cwrap('ss_rd_start', null, []),
      size:    Module.cwrap('ss_rd_set_size', null, ['number', 'number']),
      tokens:  Module.cwrap('ss_rd_load_tokens', 'number', ['string']),
      proto:   Module.cwrap('ss_rd_load_prototype', 'number', ['string']),
      show:    Module.cwrap('ss_rd_show', 'number', ['string']),
      refresh: Module.cwrap('ss_rd_refresh', 'number', []),
      status:  Module.cwrap('ss_rd_status', 'string', []),
      list:    Module.cwrap('ss_rd_screen_list', 'string', []),
      current: Module.cwrap('ss_rd_current', 'string', []),
      inspect: Module.cwrap('ss_rd_inspect', 'string', ['number', 'number']),
    };
    api.start();
    api.size(W, H);
    try { await loadData(); } catch (e) { post('status', { error: String(e), warnings: [] }); }
    api.show(params.get('path') || '');
    post('ready', { screens: JSON.parse(api.list()) });
    postStatus();
  };

  window.rdOnEvent = function (evt, detail) {
    if (evt === 'navigate') { clearPin(); post('navigate', detail); setTimeout(postStatus, 0); }
  };

  // ---- Inspector ---------------------------------------------------------
  var ov = document.getElementById('inspect');
  var hl = document.getElementById('hl');
  var pin = document.getElementById('pin');

  function toDevice(ev) {
    var r = ov.getBoundingClientRect();
    return { x: Math.round((ev.clientX - r.left) * W / r.width),
             y: Math.round((ev.clientY - r.top) * H / r.height), k: r.width / W };
  }
  function place(el, info, k) {
    if (!info.found) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.style.left = (info.x * k) + 'px';
    el.style.top = (info.y * k) + 'px';
    el.style.width = (info.w * k) + 'px';
    el.style.height = (info.h * k) + 'px';
  }
  function clearPin() { pin.style.display = 'none'; }
  function probe(ev) {
    var p = toDevice(ev);
    var info = JSON.parse(api.inspect(p.x, p.y));
    return { info: info, k: p.k };
  }
  ov.addEventListener('mousemove', function (ev) {
    if (!api) return;
    var r = probe(ev);
    place(hl, r.info, r.k);
    post('hover', r.info);
  });
  ov.addEventListener('mouseleave', function () { hl.style.display = 'none'; post('hover', { found: false }); });
  ov.addEventListener('click', function (ev) {
    if (!api) return;
    var r = probe(ev);
    place(pin, r.info, r.k);
    post('select', r.info);
  });

  // ---- Commands from the studio ------------------------------------------
  window.addEventListener('message', async function (ev) {
    var m = ev.data || {};
    if (m.src !== 'rd-studio' || !api) return;
    if (m.cmd === 'show') {
      if (api.current() !== m.path) api.show(m.path);
    } else if (m.cmd === 'reload-data') {
      try { await loadData(); } catch (e) { post('status', { error: String(e), warnings: [] }); return; }
      var path = api.current();
      api.show(path);
      post('ready', { screens: JSON.parse(api.list()) });
      postStatus();
    } else if (m.cmd === 'inspect') {
      ov.style.display = m.on ? 'block' : 'none';
      if (!m.on) { hl.style.display = 'none'; clearPin(); }
    }
  });
</script>
<script async src="index.js"></script>
</body>
</html>
